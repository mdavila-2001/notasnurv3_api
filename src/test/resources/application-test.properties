spring.datasource.url=jdbc:h2:mem:notasnurv3db;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

security.jwt.secret-key=test-secret-key-test-secret-key-test-secret-key-test-secret-key-test-secret-key
security.jwt.expiration-time=86400000
